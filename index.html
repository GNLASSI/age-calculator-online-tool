<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetAge247 - 4 Free Online Tools</title>
  <meta name="description" content="Age Calculator, BMI Calculator, Image Resizer, Word Counter. 100% Free. No Signup.">
  <style>
    body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:#f4f7f9;color:#222;}
    header{background:#2563eb;color:white;padding:30px 20px;text-align:center;}
    header h1{margin:0;}
    nav a{color:white;margin:0 15px;text-decoration:none;font-weight:600;}
    .container{max-width:1100px;margin:auto;padding:20px;}
    .tool-box{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.08);margin:25px 0;}
    .tool-box h2{color:#1e40af;margin-top:0;}
    .tool-box input, .tool-box select, .tool-box button{padding:12px;font-size:16px;border:2px solid #ddd;border-radius:8px;margin:5px;}
    .tool-box button{background:#2563eb;color:white;border:none;cursor:pointer;font-weight:bold;}
    .result{margin-top:15px;font-size:18px;font-weight:bold;color:#1e3a8a;}
    footer{background:#1e293b;color:#cbd5e1;text-align:center;padding:25px;margin-top:50px;}
    footer a{color:#93c5fd;margin:0 10px;text-decoration:none;}
  </style>
</head>
<body>

<header>
  <h1>GetAge247.xyz</h1>
  <nav><a href="/">Home</a> <a href="/about.html">About</a> <a href="/contact.html">Contact</a> <a href="/privacy-policy.html">Privacy</a></nav>
</header>

<div class="container">

  <!-- 1. AGE CALCULATOR -->
  <div class="tool-box" id="age">
    <h2>📅 Age Calculator</h2>
    <input type="date" id="dob"><button onclick="calcAge()">Calculate</button>
    <div class="result" id="ageResult"></div>
  </div>

  <!-- 2. BMI CALCULATOR -->
  <div class="tool-box" id="bmi">
    <h2>⚖️ BMI Calculator</h2>
    <input type="number" id="height" placeholder="Height in CM e.g. 170">
    <input type="number" id="weight" placeholder="Weight in KG e.g. 70"><br>
    <button onclick="calcBMI()">Calculate BMI</button>
    <div class="result" id="bmiResult"></div>
  </div>

  <!-- 3. IMAGE RESIZER -->
  <div class="tool-box" id="resizer">
    <h2>🖼️ Image Resizer</h2>
    <input type="file" id="imageInput" accept="image/*">
    <input type="number" id="widthInput" placeholder="New Width e.g. 800">
    <button onclick="resizeImg()">Resize & Download</button>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="result" id="resizerResult"></div>
  </div>

  <!-- 4. WORD COUNTER -->
  <div class="tool-box" id="wordcount">
    <h2>📝 Word Counter</h2>
    <textarea id="textInput" rows="5" style="width:95%;padding:10px;" placeholder="Paste your text here..."></textarea><br>
    <button onclick="countWords()">Count</button>
    <div class="result" id="wordResult"></div>
  </div>

</div>

<footer>
  <p>© 2026 GetAge247.xyz</p>
  <p><a href="/about.html">About</a> | <a href="/contact.html">Contact</a> | <a href="/privacy-policy.html">Privacy</a> | <a href="/ads.txt">ads.txt</a></p>
</footer>

<script>
// 1. AGE
function calcAge() {
  const dob = new Date(document.getElementById('dob').value);
  if(!dob.getTime()){document.getElementById('ageResult').innerText="Select DOB";return;}
  const t=new Date();let y=t.getFullYear()-dob.getFullYear(),m=t.getMonth()-dob.getMonth(),d=t.getDate()-dob.getDate();
  if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate();}if(m<0){y--;m+=12;}
  document.getElementById('ageResult').innerText=`${y}Y ${m}M ${d}D Old`;
}
// 2. BMI
function calcBMI(){
  const h=document.getElementById('height').value/100; const w=document.getElementById('weight').value;
  if(!h||!w){document.getElementById('bmiResult').innerText="Enter Height & Weight";return;}
  const bmi=(w/(h*h)).toFixed(1); let status=bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese';
  document.getElementById('bmiResult').innerText=`BMI: ${bmi} - ${status}`;
}
// 3. RESIZER
function resizeImg(){
  const f=document.getElementById('imageInput').files[0]; const W=parseInt(document.getElementById('widthInput').value);
  if(!f||!W){document.getElementById('resizerResult').innerText="Select Image & Width";return;}
  const img=new Image(); const r=new FileReader();
  r.onload=e=>{img.src=e.target.result}; img.onload=()=>{
    const c=document.getElementById('canvas'); const ctx=c.getContext('2d'); const S=W/img.width;
    c.width=W; c.height=img.height*S; ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{const u=URL.createObjectURL(b); document.getElementById('resizerResult').innerHTML=`Done! ${(b.size/1024).toFixed(1)}KB <a href="${u}" download="resized.jpg">Download</a>`},'image/jpeg',0.9);
  }; r.readAsDataURL(f);
}
// 4. WORD COUNTER
function countWords(){
  const t=document.getElementById('textInput').value.trim();
  const words=t?t.split(/\s+/).filter(w=>w.length>0).length:0;
  const chars=t.length; const sentences=t.split(/[.!?]+/).filter(s=>s.trim().length>0).length;
  document.getElementById('wordResult').innerText=`Words: ${words} | Characters: ${chars} | Sentences: ${sentences}`;
}
</script>

</body>
</html>
